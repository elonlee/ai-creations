<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Breakout - Classic Arcade</title>
    <style>
        :root {
            --bg-1: #06070d;
            --bg-2: #11162a;
            --panel: #101526;
            --panel-border: #28314e;
            --text: #e8edff;
            --muted: #a8b1d9;
            --accent: #63e6ff;
            --danger: #ff6b6b;
            --good: #69db7c;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            background: radial-gradient(circle at 15% 20%, #1d2a52 0%, var(--bg-1) 45%), var(--bg-1);
            color: var(--text);
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right))
                max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
        }

        #game-shell {
            width: 940px;
            max-width: 100%;
            height: min(780px, 100%);
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: linear-gradient(160deg, rgba(31, 40, 70, 0.7), rgba(9, 13, 25, 0.95));
            border: 1px solid var(--panel-border);
            box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
            padding: 14px;
        }

        #hud {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .hud-item {
            background: rgba(16, 21, 38, 0.9);
            border: 1px solid #2f3a61;
            padding: 8px;
            text-align: center;
        }

        .label { color: var(--muted); display: block; font-size: 12px; }
        .value { color: var(--text); font-weight: bold; font-size: 18px; }
        .value.combo { color: #ffd43b; }

        #status {
            margin: 8px 0;
            color: var(--muted);
            min-height: 18px;
            font-size: 13px;
        }

        #game-stage {
            position: relative;
            flex: 1;
            min-height: 0;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #result-panel {
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            width: min(460px, calc(100% - 16px));
            max-height: calc(100% - 16px);
            overflow-y: auto;
            padding: 20px;
            border: 1px solid #4b648a;
            background: linear-gradient(155deg, #192541f5, #0b1020f5);
            box-shadow: 0 16px 48px #0008;
            text-align: center;
        }
        #result-title { margin: 0; color: var(--danger); font-size: 32px; }
        #result-summary { margin: 10px 0 16px; color: var(--text); }
        .result-buttons { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
        .result-buttons button { padding: 8px 4px; }
        #share-result-btn { background: var(--accent); color: #061423; font-weight: bold; }
        #share-status { min-height: 18px; margin: 10px 0 0; font-size: 12px; line-height: 1.5; color: var(--muted); }
        #share-copy { width: 100%; min-height: 54px; margin-top: 8px; background: #0b1020; color: var(--text); border: 1px solid #4b648a; padding: 6px; font: 13px Arial; resize: none; }

        #game-canvas {
            max-width: 100%;
            max-height: 100%;
            flex: none;
            background: #070a15;
            box-shadow: inset 0 0 0 1px #2e3757;
            display: block;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            background: #18213b;
            color: var(--text);
            border: 1px solid #384671;
            padding: 8px 12px;
            min-height: 44px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover { background: #253354; border-color: var(--accent); }
        button:disabled { opacity: 0.45; cursor: default; }

        #game-menu {
            width: min(440px, calc(100% - 32px));
            max-height: calc(100dvh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
            overflow-y: auto;
            padding: clamp(24px, 5vw, 40px);
            border: 1px solid #4b648a;
            background: linear-gradient(155deg, #192541, #0b1020 75%);
            color: var(--text);
            box-shadow: 0 0 60px #63e6ff18, 0 24px 80px #0009;
            text-align: center;
        }

        #game-menu::backdrop { background: rgba(3, 6, 16, 0.82); }
        .menu-eyebrow { color: var(--accent); font: 12px 'Courier New', monospace; letter-spacing: 4px; }
        #menu-title { margin: 14px 0; font-size: clamp(32px, 8vw, 46px); letter-spacing: 3px; }
        #menu-description { color: var(--muted); line-height: 1.7; margin: 0 0 22px; }
        .menu-buttons { display: grid; gap: 10px; }
        .menu-buttons button { min-height: 48px; }
        .menu-buttons .primary { background: var(--accent); border-color: var(--accent); color: #061423; font-weight: bold; }
        .menu-buttons .primary:hover { background: #a1f1ff; }
        .menu-help { border-top: 1px solid var(--panel-border); margin: 24px 0 0; padding-top: 18px; color: var(--muted); font-size: 13px; line-height: 1.9; }
        .menu-help p { margin: 0; }
        .leaderboard-status { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 10px 0 0; }
        [hidden] { display: none !important; }

        button:focus-visible {
            outline: 2px solid #77b6ff;
            outline-offset: 2px;
        }

        #mobile-controls {
            margin-top: 10px;
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        #mobile-controls button {
            min-height: 48px;
            font-size: 18px;
            font-weight: bold;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        @media (max-width: 1024px), (pointer: coarse) {
            body {
                padding: max(4px, env(safe-area-inset-top)) max(4px, env(safe-area-inset-right))
                    max(4px, env(safe-area-inset-bottom)) max(4px, env(safe-area-inset-left));
            }
            #game-shell {
                height: 100%;
                padding: 6px;
                display: grid;
                grid-template-columns: minmax(0, 1fr) 64px;
                grid-template-rows: auto auto minmax(0, 1fr) auto;
                gap: 6px;
            }
            #hud {
                grid-column: 1;
                grid-row: 1;
                grid-template-columns: repeat(5, minmax(0, 1fr));
                gap: 4px;
                margin: 0;
                min-width: 0;
            }
            .hud-item { min-width: 0; padding: 4px 2px; }
            .label { font-size: 10px; }
            .value { display: block; font-size: 16px; overflow: hidden; text-overflow: ellipsis; }
            #status {
                grid-column: 1 / -1;
                grid-row: 2;
                margin: 0;
                font-size: 12px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            #game-stage { grid-column: 1 / -1; grid-row: 3; }
            #actions { grid-column: 2; grid-row: 1; margin: 0; }
            #actions button:not(#pause-btn) { display: none; }
            #pause-btn { width: 64px; padding: 6px; }
            #leaderboard-status { display: none; }
            #mobile-controls { display: grid; grid-column: 1 / -1; grid-row: 4; margin: 0; }
            #game-menu { padding: 22px; }
            #result-panel { padding: 10px; }
            #result-title { font-size: 23px; }
            #result-summary { margin: 6px 0 10px; font-size: 13px; }
            .result-buttons button { font-size: 13px; }
            #share-status { margin-top: 6px; }
        }

        @media (max-width: 1024px) and (max-height: 500px) and (orientation: landscape),
            (pointer: coarse) and (max-height: 500px) and (orientation: landscape) {
            #game-shell {
                grid-template-columns: 64px minmax(0, 1fr) 64px;
                grid-template-rows: 44px minmax(0, 1fr);
            }
            #hud { grid-column: 2; grid-row: 1; }
            #actions { grid-column: 3; grid-row: 1; }
            #status { display: none; }
            #game-stage { grid-column: 2; grid-row: 2; }
            #mobile-controls { display: contents; }
            #left-btn { grid-column: 1; grid-row: 2; }
            #right-btn { grid-column: 3; grid-row: 2; }
            #left-btn, #right-btn { align-self: center; height: 96px; }
            #launch-mobile-btn { grid-column: 1; grid-row: 1; min-height: 44px; }
            #game-menu { width: min(620px, calc(100% - 32px)); padding: 16px; }
            #menu-title { font-size: 28px; margin: 6px 0; }
            .menu-eyebrow { font-size: 10px; letter-spacing: 2px; }
            #menu-description { margin-bottom: 12px; font-size: 13px; line-height: 1.5; }
            .menu-buttons { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
            .menu-buttons button { min-height: 44px; }
            #menu-primary-btn { grid-column: 1 / -1; }
            .menu-help { display: none; }
            #menu-leaderboard-status { font-size: 12px; }
        }
    </style>
</head>
<body>
    <div id="game-shell">
        <div id="hud">
            <div class="hud-item"><span class="label">SCORE</span><span class="value" id="score">0</span></div>
            <div class="hud-item"><span class="label">HIGH</span><span class="value" id="high-score">0</span></div>
            <div class="hud-item"><span class="label">LIVES</span><span class="value" id="lives">3</span></div>
            <div class="hud-item"><span class="label">LEVEL</span><span class="value" id="level">1</span></div>
            <div class="hud-item"><span class="label">COMBO</span><span class="value combo" id="combo">x1</span></div>
        </div>
        <div id="status">按空格发球，左右方向键移动挡板</div>
        <div id="game-stage">
            <canvas id="game-canvas" width="900" height="540" aria-label="Breakout 游戏画布，可拖动移动挡板" tabindex="0"></canvas>
            <section id="result-panel" aria-labelledby="result-title" hidden>
                <h2 id="result-title">挑战结束</h2>
                <p id="result-summary" aria-live="polite"></p>
                <div class="result-buttons">
                    <button id="share-result-btn" type="button">分享成绩</button>
                    <button id="result-restart-btn" type="button">再来一局</button>
                    <button id="result-home-btn" type="button">主菜单</button>
                </div>
                <p id="share-status" role="status">晒出本局成绩，邀请朋友挑战</p>
                <textarea id="share-copy" aria-label="成绩分享文案，可长按复制" readonly hidden></textarea>
            </section>
        </div>
        <div id="actions">
            <button id="launch-btn" type="button">发球 (Space)</button>
            <button id="pause-btn" type="button">暂停</button>
            <button id="restart-btn" type="button">重开 (R)</button>
            <button id="sound-btn" type="button" aria-pressed="true">声音: 开</button>
            <button id="main-menu-btn" type="button">主菜单</button>
            <button id="leaderboard-btn" type="button">每周排行榜</button>
            <button id="retry-score-btn" type="button" hidden>重试提交成绩</button>
        </div>
        <p id="leaderboard-status" class="leaderboard-status" role="status">本周最高单局分数 · 每周重置</p>
        <div id="mobile-controls" aria-label="移动端控制">
            <button id="left-btn" type="button" aria-label="左移">◀</button>
            <button id="launch-mobile-btn" type="button" aria-label="发球">发球</button>
            <button id="right-btn" type="button" aria-label="右移">▶</button>
        </div>
    </div>

    <dialog id="game-menu" aria-labelledby="menu-title" aria-describedby="menu-description">
        <div class="menu-eyebrow">CLASSIC ARCADE · 01</div>
        <h1 id="menu-title">BREAKOUT</h1>
        <p id="menu-description">守住挡板，击碎每一块砖。<br>挑战十个主题关卡，刷新你的最高分。</p>
        <div class="menu-buttons">
            <button id="menu-primary-btn" class="primary" type="button" autofocus>开始游戏</button>
            <button id="menu-restart-btn" type="button" hidden>重新开始</button>
            <button id="menu-home-btn" type="button" hidden>返回主菜单（结束本局）</button>
            <button id="menu-leaderboard-btn" type="button">每周排行榜</button>
            <button id="menu-retry-score-btn" type="button" hidden>重试提交成绩</button>
            <button id="menu-sound-btn" type="button" aria-pressed="true">声音: 开</button>
        </div>
        <p id="menu-leaderboard-status" class="leaderboard-status" role="status">本周最高单局分数 · 每周重置</p>
        <div class="menu-help">
            <p>← → / A D / 鼠标 / 触屏移动挡板</p>
            <p>空格发球 · P / Esc 暂停 · R 重开</p>
        </div>
    </dialog>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const gameStage = document.getElementById('game-stage');

        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const livesEl = document.getElementById('lives');
        const levelEl = document.getElementById('level');
        const comboEl = document.getElementById('combo');
        const statusEl = document.getElementById('status');
        const resultPanel = document.getElementById('result-panel');
        const resultTitle = document.getElementById('result-title');
        const resultSummary = document.getElementById('result-summary');
        const shareResultBtn = document.getElementById('share-result-btn');
        const shareStatus = document.getElementById('share-status');
        const shareCopy = document.getElementById('share-copy');

        const launchBtn = document.getElementById('launch-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const restartBtn = document.getElementById('restart-btn');
        const soundBtn = document.getElementById('sound-btn');

        const menu = document.getElementById('game-menu');
        const menuTitle = document.getElementById('menu-title');
        const menuDescription = document.getElementById('menu-description');
        const menuPrimaryBtn = document.getElementById('menu-primary-btn');
        const menuRestartBtn = document.getElementById('menu-restart-btn');
        const menuHomeBtn = document.getElementById('menu-home-btn');
        const mainMenuBtn = document.getElementById('main-menu-btn');
        const soundButtons = [soundBtn, document.getElementById('menu-sound-btn')];

        const WIDTH = canvas.width;
        const HEIGHT = canvas.height;
        function fitCanvas() {
            // 只缩放显示尺寸，物理坐标保持 900×540，旋屏不会重置本局。
            const width = Math.min(gameStage.clientWidth, gameStage.clientHeight * WIDTH / HEIGHT);
            canvas.style.width = `${width}px`;
            canvas.style.height = `${width * HEIGHT / WIDTH}px`;
        }

        // 应用 985310 的服务端模板已审核通过（模板 ID 824）。
        const SHARE_TEMPLATE_ID = 'ST1792394335418E8UEMKVVA';
        let activeShare = null;

        function resetResultShare() {
            const previous = activeShare;
            activeShare = null;
            if (previous?.listening) {
                previous.listening = false;
                try { previous.tap.offShareMessage?.(); } catch (_) { /* 不阻止新一局 */ }
            }
            shareResultBtn.disabled = false;
            shareStatus.textContent = '晒出本局成绩，邀请朋友挑战';
            shareCopy.hidden = true;
            shareCopy.value = '';
        }

        async function shareResult() {
            if ((!state.gameOver && !state.win) || state.menu || shareResultBtn.disabled) return;
            resetResultShare();
            const attempt = { run: runNumber, tap: window.tap, listening: false };
            activeShare = attempt;
            const isCurrent = () => activeShare === attempt && runNumber === attempt.run && !state.menu && (state.gameOver || state.win);
            const message = text => { if (isCurrent()) shareStatus.textContent = text; };
            const release = () => { if (isCurrent()) shareResultBtn.disabled = false; };
            const stopListening = () => {
                if (!attempt.listening || activeShare !== attempt) return;
                attempt.listening = false;
                try { attempt.tap.offShareMessage?.(); } catch (_) { /* 分享结果不依赖解绑结果 */ }
            };
            const text = `我在《经典打砖块》${state.win ? `通关全部 ${LEVELS.length} 关` : `闯到第 ${state.level}/${LEVELS.length} 关`}，获得 ${state.score} 分！来挑战我的高分！`;
            const manualCopy = () => {
                if (!isCurrent()) return;
                shareCopy.value = text;
                shareCopy.hidden = false;
                message('可在下方长按或选中文字复制');
            };
            shareResultBtn.disabled = true;
            message('正在打开分享…');
            if (typeof attempt.tap?.showShareboard === 'function') {
                try {
                    if (typeof attempt.tap.onShareMessage === 'function' && typeof attempt.tap.offShareMessage === 'function') {
                        attempt.listening = true;
                        attempt.tap.onShareMessage({
                            success: () => { attempt.finished = true; message('分享成功，邀请朋友来挑战吧！'); release(); stopListening(); },
                            fail: () => { attempt.finished = true; message('分享未完成，可再次尝试'); release(); stopListening(); }
                        });
                    }
                    attempt.tap.showShareboard({
                        templateId: SHARE_TEMPLATE_ID,
                        // 场景参数只传递本局信息；不用于恢复进度或写入排行榜。
                        sceneParam: JSON.stringify({ score: state.score, level: state.level, totalLevels: LEVELS.length, cleared: state.win }),
                        success: () => { if (!attempt.finished) message('分享面板已打开，请选择分享渠道'); release(); },
                        fail: () => { if (!attempt.finished) message('分享面板打开失败，请重试'); release(); stopListening(); }
                    });
                } catch (_) {
                    message('分享暂不可用，请重试');
                    release();
                    stopListening();
                }
                return;
            }
            const nav = window.navigator;
            try {
                if (typeof nav?.share === 'function') {
                    await nav.share({ title: '经典打砖块 · 挑战我的高分', text });
                    // 系统分享的完成语义因渠道而异，不宣称对方已收到。
                    message('已完成系统分享操作');
                } else if (typeof nav?.clipboard?.writeText === 'function') {
                    await nav.clipboard.writeText(text);
                    message('成绩文案已复制，可以粘贴分享给朋友');
                } else {
                    manualCopy();
                }
            } catch (error) {
                if (error?.name === 'AbortError') message('已取消分享');
                else manualCopy();
            } finally {
                release();
            }
        }

        const HIGH_SCORE_KEY = 'breakoutHighScore';
        // 应用 985310：数值降序，每周 00:00:00 重置，每人保留本周期最高分。
        const WEEKLY_LEADERBOARD_ID = 'saf3rqj1i105omprpk';
        const leaderboardButtons = [document.getElementById('leaderboard-btn'), document.getElementById('menu-leaderboard-btn')];
        const retryScoreButtons = [document.getElementById('retry-score-btn'), document.getElementById('menu-retry-score-btn')];
        const leaderboardStatusEls = [document.getElementById('leaderboard-status'), document.getElementById('menu-leaderboard-status')];
        let runNumber = 0;
        let scoreSubmission = null;

        function setLeaderboardStatus(message, retry = false) {
            leaderboardStatusEls.forEach(el => { el.textContent = message; });
            retryScoreButtons.forEach(button => { button.hidden = !retry; });
        }

        function getLeaderboardManager() {
            // 普通浏览器没有 TapTap 运行环境，游戏本身仍可正常游玩。
            try {
                return window.tap?.getLeaderboardManager?.() || null;
            } catch (_) {
                return null;
            }
        }

        function submitFinalScore(retry = false) {
            const score = state.score;
            if (!Number.isSafeInteger(score) || score <= 0 || runNumber === 0) return;
            if (scoreSubmission && (!retry || scoreSubmission.status !== 'failed')) return;
            const manager = getLeaderboardManager();
            if (typeof manager?.submitScores !== 'function') {
                setLeaderboardStatus(`本局 ${score} 分；在 TapTap 内游玩可参与周榜。`);
                return;
            }
            const submission = { run: runNumber, score, status: 'pending' };
            scoreSubmission = submission;
            setLeaderboardStatus(`正在提交本局 ${score} 分…`);
            const onFailure = () => {
                submission.status = 'failed';
                if (scoreSubmission === submission && runNumber === submission.run) {
                    setLeaderboardStatus(`本局 ${score} 分提交失败，请在开始下一局前重试。`, true);
                }
            };
            try {
                manager.submitScores({
                    scores: [{ leaderboardId: WEEKLY_LEADERBOARD_ID, score }],
                    callback: {
                        onSuccess: () => {
                            submission.status = 'success';
                            // 上一局的回调不能覆盖新一局的提示。
                            if (scoreSubmission === submission && runNumber === submission.run) {
                                setLeaderboardStatus(`已提交本局 ${score} 分，周榜保留本周最高单局分数。`);
                            }
                        },
                        onFailure
                    }
                });
            } catch (_) {
                onFailure();
            }
        }

        function openWeeklyLeaderboard() {
            const manager = getLeaderboardManager();
            if (typeof manager?.openLeaderboard !== 'function') {
                setLeaderboardStatus('请在 TapTap 内打开游戏后查看每周排行榜。');
                return;
            }
            if (isPlaying()) togglePause();
            const onFailure = () => {
                setLeaderboardStatus('排行榜暂时无法打开，请稍后重试。', scoreSubmission?.status === 'failed');
            };
            try {
                manager.openLeaderboard({
                    leaderboardId: WEEKLY_LEADERBOARD_ID,
                    collection: 'public',
                    callback: { onSuccess: () => {}, onFailure }
                });
            } catch (_) {
                onFailure();
            }
            // 原生面板关闭后保持暂停，由玩家选择继续。
        }

        const BRICK_COLS = 12;
        const BRICK_W = 62;
        const BRICK_H = 22;
        const BRICK_GAP = 8;
        const BRICK_TOP = 72;
        const BRICK_LEFT = (WIDTH - (BRICK_COLS * BRICK_W + (BRICK_COLS - 1) * BRICK_GAP)) / 2;

        // 每行 12 格：. 留空，1–4 为耐久，* 为连锁爆破砖。没有不可摧毁砖。
        const LEVELS = [
            { name: '霓虹启航', hint: '从挡板两侧击球，寻找反弹角度', color: '#63e6ff', speed: 360, paddle: 148,
                map: ['111111111111', '111111111111', '.111....111.', '..111..111..', '...111111...'] },
            { name: '双子之门', hint: '穿过中间通道，从背后拆掉双塔', color: '#69db7c', speed: 380, paddle: 144,

        const STAGE_COLORS = [["#ff6b8a", "#ffb454", "#ffe066", "#63e6ff", "#b197fc"], ["#69db7c", "#38d9a9", "#a9e34b"], ["#b197fc", "#da77f2", "#74c0fc"], ["#ffa94d", "#ff6b6b", "#ffd43b"], ["#74c0fc", "#63e6ff", "#91a7ff"], ["#f783ac", "#da77f2", "#ffa8a8"], ["#ffd43b", "#ffa94d", "#fff3bf"], ["#38d9a9", "#63e6ff", "#69db7c"], ["#ff6b6b", "#ffa94d", "#ff8787"], ["#ff87d4", "#b197fc", "#63e6ff"]];
        const currentLevel = () => LEVELS[state.level - 1];

        const state = {

        const keys = { left: false, right: false };
        let mobileLeft = false;

        const audio = {
            enabled: true,
            initialized: false,
            ctx: null,

        function initAudio() {
            if (audio.initialized) return;
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) {
                audio.enabled = false;
                soundButtons.forEach(button => {
                    button.textContent = '声音: 不支持';
                    button.disabled = true;
                    button.setAttribute('aria-pressed', 'false');
                });
                return;
            }
            audio.ctx = new Ctx();
            audio.master = audio.ctx.createGain();
            audio.sfx = audio.ctx.createGain();
            audio.music = audio.ctx.createGain();
            audio.master.gain.value = 0.7;
            audio.sfx.gain.value = 0.9;
            audio.music.gain.value = 0.62;
            audio.sfx.connect(audio.master);
            audio.music.connect(audio.master);
            audio.master.connect(audio.ctx.destination);
            audio.initialized = true;
        }

        function beep(freq, duration, type = 'square', volume = 0.08, offset = 0, retried = false) {
            if (!audio.enabled || state.paused || state.menu) return;
            initAudio();
            if (!audio.ctx) return;
            if (audio.ctx.state !== 'running') {
                if (retried) return;
                audio.ctx.resume().then(() => {
                    beep(freq, duration, type, volume, offset, true);
                }).catch(() => {});
                return;
            }
            const start = audio.ctx.currentTime + offset;
            const osc = audio.ctx.createOscillator();
            const gain = audio.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(volume, start + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
            osc.connect(gain);
            gain.connect(audio.sfx);
            osc.start(start);
            osc.stop(start + duration + 0.02);
        }

        function musicTone(freq, duration, type = 'triangle', volume = 0.045, offset = 0, retried = false) {
            if (!audio.enabled || !isPlaying()) return;
            initAudio();
            if (!audio.ctx) return;
            if (audio.ctx.state !== 'running') {
                if (retried) return;
                audio.ctx.resume().then(() => {
                    musicTone(freq, duration, type, volume, offset, true);
                }).catch(() => {});
                return;
            }
            const start = audio.ctx.currentTime + offset;
            const osc = audio.ctx.createOscillator();
            const gain = audio.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(volume, start + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
            osc.connect(gain);
            gain.connect(audio.music);
            osc.start(start);
            osc.stop(start + duration + 0.03);
        }

        function isPlaying() {
            return state.running && !state.paused && !state.menu;
        }

        function syncAudio() {
            if (!audio.ctx) return;
            if (!audio.enabled || !isPlaying()) {
                stopMusic();
                audio.ctx.suspend().catch(() => {});
                return;
            }
            audio.ctx.resume().then(() => {
                // 用户可能在音频恢复完成前再次暂停。
                if (audio.enabled && isPlaying()) startMusic();
                else syncAudio();
            }).catch(() => {});
        }

        function unlockAudio() {
            initAudio();
            syncAudio();
        }

        function startMusic() {
            if (!audio.enabled || !isPlaying() || audio.musicTimer) return;
            const melody = [392, 440, 494, 523, 494, 440, 392, 330];
            const bass = [131, 147, 165, 175, 165, 147, 131, 110];
            audio.beat = 0;
            audio.musicTimer = setInterval(() => {
                if (!audio.enabled || !audio.ctx || audio.ctx.state !== 'running') return;
                if (!state.running || state.paused || state.gameOver || state.win) return;
                const n = melody[audio.beat % melody.length];
                musicTone(n, 0.16, 'triangle', 0.06);
                musicTone(bass[audio.beat % bass.length], 0.2, 'sine', 0.05);
                audio.beat += 1;
            }, 190);
        }

        function stopMusic() {
            if (audio.musicTimer) {
                clearInterval(audio.musicTimer);
                audio.musicTimer = null;
            }
        }

        function setSoundEnabled(enabled) {
            audio.enabled = enabled;
            soundButtons.forEach(button => {

        function clamp(v, min, max) {
            return Math.max(min, Math.min(max, v));
        }

        function setStatus(text) {

        function resetBall() {
            const ball = state.ball;
            ball.launched = false;
            ball.vx = 0;
            ball.vy = 0;
            ball.x = state.paddle.x + state.paddle.w / 2;
            ball.y = state.paddle.y - ball.r - 2;
            ball.trail = [];
        }

        function createBricks(level) {
            const config = LEVELS[level - 1];
            const bricks = [];
            config.map.forEach((row, r) => {
                [...row].forEach((cell, c) => {
                    if (cell === '.') return;
                    const explosive = cell === '*';
                    const hp = explosive ? 1 : Number(cell);
                    const x = BRICK_LEFT + c * (BRICK_W + BRICK_GAP);
                    bricks.push({
                        x, baseX: x, row: r, col: c,
                        y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
                        w: BRICK_W, h: BRICK_H, hp, maxHp: hp,
                        explosive, hitTime: 0, alive: true,
                        color: explosive ? '#ffb454' : STAGE_COLORS[level - 1][r % STAGE_COLORS[level - 1].length]
                    });
                });
            });
            state.bricks = bricks;
        }

        function enterLevel(level) {
            state.level = level;
            const config = currentLevel();
            state.paddle.w = config.paddle;
            state.paddle.x = WIDTH / 2 - config.paddle / 2;
            state.paddle.dx = 0;
            state.ball.speed = config.speed;
            state.stageTime = 0;
            state.levelIntro = true;
            state.transition = null;
            state.combo = 1;
            state.comboTimer = 0;
            createBricks(level);
            resetBall();
            setStatus(`第 ${level}/${LEVELS.length} 关 · ${config.name} · ${config.hint}`);
            updateHud();
        }

        function resetLevel(level = 1, preserveScore = false) {
            if (!preserveScore) {
                state.score = 0;
                state.lives = 3;
            }
            state.running = true;
            state.paused = false;
            state.gameOver = false;
            state.win = false;
            state.particles = [];
            state.effects = [];
            resetResultShare();
            state.shake = { time: 0, strength: 0 };
            state.flash = { time: 0, color: '#ffffff' };
            enterLevel(level);

        function launchBall() {
            if (state.gameOver || state.win) {
                restart();
                return;
            }
            if (!isPlaying() || state.transition) return;
            unlockAudio();
            if (!state.ball.launched) {
                const angle = -Math.PI / 2 + (Math.random() * 0.65 - 0.325);
                state.ball.vx = Math.cos(angle) * state.ball.speed;
                state.ball.vy = Math.sin(angle) * state.ball.speed;
                state.ball.launched = true;
                state.levelIntro = false;
                setStatus(`第 ${state.level}/${LEVELS.length} 关 · ${currentLevel().name} · ${currentLevel().hint}`);
                sfxLaunch();
            }
        }

        function updateHud() {
            scoreEl.textContent = String(state.score);
            highScoreEl.textContent = String(state.highScore);

            levelEl.textContent = `${state.level}/${LEVELS.length}`;
            comboEl.textContent = `x${state.combo}`;
            const finished = state.gameOver || state.win;
            resultPanel.hidden = !finished || Boolean(state.menu);
            if (finished) {
                resultTitle.textContent = state.win ? '十关通关！' : '挑战结束';
                resultTitle.style.color = state.win ? '#69db7c' : '#ff6b6b';
                resultSummary.textContent = `${state.score} 分 · ${state.win ? `全部 ${LEVELS.length} 关已突破` : `到达第 ${state.level}/${LEVELS.length} 关`}`;

        function addScore(base, multiplier = state.combo) {
            state.score += base * multiplier;
            if (state.score > state.highScore) {
                state.highScore = state.score;
                localStorage.setItem(HIGH_SCORE_KEY, String(state.highScore));
            }
        }

        function triggerShake(strength, duration) {
            state.shake.time = Math.max(state.shake.time, duration);
            state.shake.strength = Math.max(state.shake.strength, strength);
        }

        function triggerFlash(color, duration) {
            state.flash.color = color;
            state.flash.time = Math.max(state.flash.time, duration);
        }

        function spawnBrickParticles(brick, impactX, impactY) {
            for (let i = 0; i < 16; i += 1) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 180 + 90;
                state.particles.push({
                    x: impactX,
                    y: impactY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 0.65,
                    maxLife: 0.65,
                    size: Math.random() * 3 + 2,
                    color: brick.color
                });
            }
            // 连锁爆破也限制粒子数量，避免手机上积累过多绘制工作。
            if (state.particles.length > 480) state.particles.splice(0, state.particles.length - 480);
        }

        function addEffect(x, y, text, color, ring = false) {
            state.effects.push({ x, y, text, color, ring, life: 0.8, maxLife: 0.8 });
            if (state.effects.length > 40) state.effects.shift();
        }

        function loseLife() {
            state.lives -= 1;
            state.combo = 1;
            state.comboTimer = 0;
            triggerFlash('#ff6b6b', 0.35);
            triggerShake(12, 0.25);
            if (state.lives <= 0) {
                state.running = false;
                state.gameOver = true;
                setStatus('游戏结束：点击重开或按 R 再来一局');
                pauseBtn.textContent = '主菜单';
                updateHud();
                submitFinalScore();
                stopMusic();
                sfxGameOver();
                return;
            }
            state.ball.speed = currentLevel().speed;
            resetBall();
            setStatus('掉球了，点击发球或按空格继续');
            sfxLoseLife();
        }

        function damageBrick(brick, impactX, impactY) {
            if (!brick.alive) return;
            brick.hp -= 1;
            brick.hitTime = 0.16;
            spawnBrickParticles(brick, impactX, impactY);
            if (brick.hp > 0) {
                addScore(4);
                return;
            }
            // 先标记死亡，再触发邻格，避免爆破环路重复得分。
            brick.alive = false;
            state.combo = Math.min(8, state.combo + 1);
            state.comboTimer = 2.2;
            const points = (12 + state.level * 2) * state.combo;
            addScore(12 + state.level * 2);
            addEffect(brick.x + brick.w / 2, brick.y, `+${points}`, brick.color, brick.explosive);
            if (brick.explosive) {
                triggerShake(9, 0.18);
                beep(110, 0.14, 'sawtooth', 0.05);
                for (const neighbor of state.bricks) {
                    if (neighbor.alive && Math.abs(neighbor.row - brick.row) <= 1 && Math.abs(neighbor.col - brick.col) <= 1) {
                        damageBrick(neighbor, neighbor.x + neighbor.w / 2, neighbor.y + neighbor.h / 2);
                    }
                }
            }
        }

        function completeLevel() {
            const bonus = state.level * 150;
            // 过关奖励不乘连击；第 3、6、9 关补一条命，上限五条。
            addScore(bonus, 1);
            const extraLife = state.level % 3 === 0 && state.lives < 5;
            if (extraLife) state.lives += 1;
            resetBall();
            state.levelIntro = false;
            updateHud();
            sfxWin();
            if (state.level === LEVELS.length) {
                state.running = false;
                state.win = true;
                pauseBtn.textContent = '主菜单';
                updateHud();
                setStatus(`十关全部突破！本局 ${state.score} 分`);
                submitFinalScore();
                stopMusic();
            } else {
                state.transition = { remaining: 1.25, bonus, extraLife };
                setStatus(`第 ${state.level} 关完成，奖励 ${bonus} 分${extraLife ? '，生命 +1' : ''}`);
            }
        }

        function handleBrickHit(brick, ball) {
            if (!brick.alive || state.transition || state.win) return;
            damageBrick(brick, clamp(ball.x, brick.x, brick.x + brick.w), clamp(ball.y, brick.y, brick.y + brick.h));
            triggerShake(4, 0.1);
            if (brick.alive) {
                triggerFlash('#ffd43b', 0.04);
                sfxBrickHit();
            } else {
                sfxBrickBreak();
            }
            if (state.bricks.every((b) => !b.alive)) completeLevel();
        }

        function updateBricks(dt) {
            if (state.ball.launched) state.stageTime += dt;
            const motion = currentLevel().motion || 0;
            for (const brick of state.bricks) {
                brick.hitTime = Math.max(0, brick.hitTime - dt);
                brick.x = brick.baseX + Math.sin(state.stageTime * 1.1) * motion * (brick.row % 2 ? -1 : 1);
            }
        }

        function updateBall(dt) {
            if (state.transition || !state.running) return;
            const ball = state.ball;
            if (!ball.launched) {
                ball.x = state.paddle.x + state.paddle.w / 2;
                ball.y = state.paddle.y - ball.r - 2;
                return;
            }

            const steps = Math.max(1, Math.ceil((Math.abs(ball.vx) + Math.abs(ball.vy)) * dt / ball.r));
            const stepDt = dt / steps;

            for (let i = 0; i < steps; i += 1) {
                const previousX = ball.x;
                const previousY = ball.y;
                ball.x += ball.vx * stepDt;
                ball.y += ball.vy * stepDt;

                if (ball.x <= ball.r) {
                    ball.x = ball.r;
                    ball.vx = Math.abs(ball.vx);
                    triggerShake(3, 0.06);
                    sfxWall();
                } else if (ball.x >= WIDTH - ball.r) {
                    ball.x = WIDTH - ball.r;
                    ball.vx = -Math.abs(ball.vx);
                    triggerShake(3, 0.06);
                    sfxWall();
                }

                if (ball.y <= ball.r) {
                    ball.y = ball.r;
                    ball.vy = Math.abs(ball.vy);
                    triggerShake(3, 0.06);
                    sfxWall();
                }

                if (ball.y > HEIGHT + ball.r) {
                    loseLife();
                    return;
                }

                const p = state.paddle;
                if (
                    ball.y + ball.r >= p.y &&
                    ball.y - ball.r <= p.y + p.h &&
                    ball.x >= p.x &&
                    ball.x <= p.x + p.w &&
                    ball.vy > 0
                ) {
                    const hit = (ball.x - (p.x + p.w / 2)) / (p.w / 2);
                    const speed = Math.min(currentLevel().speed + 140, Math.hypot(ball.vx, ball.vy) * 1.025);
                    ball.vx = hit * speed * 0.9;
                    ball.vy = -Math.abs(Math.sqrt(Math.max(12000, speed * speed - ball.vx * ball.vx)));
                    ball.y = p.y - ball.r - 0.1;
                    state.combo = 1;
                    state.comboTimer = 0;
                    sfxPaddle();
                }

                for (const brick of state.bricks) {
                    if (!brick.alive) continue;
                    if (
                        ball.x + ball.r < brick.x ||
                        ball.x - ball.r > brick.x + brick.w ||
                        ball.y + ball.r < brick.y ||
                        ball.y - ball.r > brick.y + brick.h
                    ) continue;

                    const cx = clamp(ball.x, brick.x, brick.x + brick.w);
                    const cy = clamp(ball.y, brick.y, brick.y + brick.h);
                    const dx = ball.x - cx;
                    const dy = ball.y - cy;
                    if (dx * dx + dy * dy > ball.r * ball.r) continue;

                    // 将球推回碰撞面，避免厚装甲在连续子步中被重复扣血。
                    if (previousY + ball.r <= brick.y) {
                        ball.y = brick.y - ball.r - 0.1;
                        ball.vy = -Math.abs(ball.vy);
                    } else if (previousY - ball.r >= brick.y + brick.h) {
                        ball.y = brick.y + brick.h + ball.r + 0.1;
                        ball.vy = Math.abs(ball.vy);
                    } else if (Math.abs(dx) > Math.abs(dy) || previousX + ball.r <= brick.x || previousX - ball.r >= brick.x + brick.w) {
                        const left = ball.x < brick.x + brick.w / 2;
                        ball.x = left ? brick.x - ball.r - 0.1 : brick.x + brick.w + ball.r + 0.1;
                        ball.vx = (left ? -1 : 1) * Math.abs(ball.vx);
                    } else {
                        const above = ball.y < brick.y + brick.h / 2;
                        ball.y = above ? brick.y - ball.r - 0.1 : brick.y + brick.h + ball.r + 0.1;
                        ball.vy = (above ? -1 : 1) * Math.abs(ball.vy);
                    }
                    handleBrickHit(brick, ball);
                    if (!ball.launched || !state.running) return;
                    break;
                }
            }

            ball.trail.unshift({ x: ball.x, y: ball.y });
            if (ball.trail.length > 9) ball.trail.pop();
        }

        function updatePaddle(dt) {
            let dir = 0;
            if (keys.left || mobileLeft) dir -= 1;
            if (keys.right || mobileRight) dir += 1;
            state.paddle.dx = dir * state.paddle.speed;
            state.paddle.x += state.paddle.dx * dt;
            state.paddle.x = clamp(state.paddle.x, 0, WIDTH - state.paddle.w);
        }

        function updateStars(dt) {
            state.stars.forEach((s) => {
                s.y += s.v * dt;
                if (s.y > HEIGHT) {
                    s.y = -2;
                    s.x = Math.random() * WIDTH;
                }
            });
        }

        function updateParticles(dt) {
            state.particles = state.particles.filter((p) => {
                p.life -= dt;
                if (p.life <= 0) return false;
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += 380 * dt;
                p.vx *= 0.985;
                p.vy *= 0.985;
                return true;
            });
        }

        function update(dt) {
            if (state.paused || state.menu) return;
            if (audio.enabled && audio.ctx && audio.ctx.state === 'running' && state.running && !state.paused && !state.gameOver && !state.win && !audio.musicTimer) {
                startMusic();
            }
            updateStars(dt);
            updateParticles(dt);
            state.effects = state.effects.filter(effect => {
                effect.life -= dt;
                return effect.life > 0;
            });
            state.shake.time = Math.max(0, state.shake.time - dt);
            state.flash.time = Math.max(0, state.flash.time - dt);
            if (!state.running) return;
            if (state.transition) {
                state.transition.remaining -= dt;
                if (state.transition.remaining <= 0) enterLevel(state.level + 1);
                return;
            }
            updateBricks(dt);
            updatePaddle(dt);
            updateBall(dt);

            if (state.comboTimer > 0) {
                state.comboTimer -= dt;
                if (state.comboTimer <= 0) {
                    state.combo = 1;
                }
            }

            updateHud();
        }

        function drawBackground(t) {
            const g = ctx.createLinearGradient(0, 0, 0, HEIGHT);
            g.addColorStop(0, '#0d1328');
            g.addColorStop(1, '#05070f');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            ctx.globalAlpha = 0.85;
            for (const s of state.stars) {
                ctx.fillStyle = '#9ac0ff';
                ctx.fillRect(s.x, s.y, s.s, s.s);
            }
            ctx.globalAlpha = 1;

            ctx.strokeStyle = 'rgba(105, 219, 124, 0.08)';
            for (let y = 0; y < HEIGHT; y += 24) {
                const offset = Math.sin((t * 0.0015) + y * 0.05) * 8;
                ctx.beginPath();
                ctx.moveTo(offset, y);
                ctx.lineTo(WIDTH + offset, y);
                ctx.stroke();
            }
        }

        function drawBricks(t) {
            for (const brick of state.bricks) {
                if (!brick.alive) continue;
                ctx.fillStyle = brick.hitTime > 0 ? '#ffffff' : brick.color;
                ctx.globalAlpha = 0.48 + brick.hp / brick.maxHp * 0.4;
                ctx.fillRect(brick.x, brick.y, brick.w, brick.h);
                ctx.globalAlpha = 1;
                ctx.fillStyle = 'rgba(255,255,255,0.35)';
                ctx.fillRect(brick.x + 2, brick.y + 2, brick.w - 4, 2);
                ctx.strokeStyle = brick.color;
                ctx.strokeRect(brick.x + 0.5, brick.y + 0.5, brick.w - 1, brick.h - 1);
                if (brick.explosive) {
                    const cx = brick.x + brick.w / 2, cy = brick.y + brick.h / 2;
                    ctx.strokeStyle = '#fff4dc';
                    ctx.beginPath();
                    ctx.moveTo(cx, cy - 6); ctx.lineTo(cx + 7, cy);
                    ctx.lineTo(cx, cy + 6); ctx.lineTo(cx - 7, cy);
                    ctx.closePath(); ctx.stroke();
                } else if (brick.maxHp > 1) {
                    for (let i = 0; i < brick.maxHp; i += 1) {
                        ctx.fillStyle = i < brick.hp ? '#ffffff' : 'rgba(0,0,0,0.35)';
                        ctx.fillRect(brick.x + brick.w / 2 - brick.maxHp * 5 + i * 10, brick.y + 9, 6, 5);
                    }
                }
            }
        }

        function drawStageInfo() {
            const config = currentLevel();
            const remaining = state.bricks.filter(brick => brick.alive).length;
            ctx.textAlign = 'left';
            ctx.fillStyle = config.color;
            ctx.font = 'bold 18px Arial';
            ctx.fillText(`${String(state.level).padStart(2, '0')} / ${LEVELS.length}   ${config.name}`, 34, 30);
            ctx.textAlign = 'right';
            ctx.fillStyle = '#afbdd5';
            ctx.font = '14px Arial';
            ctx.fillText(`剩余 ${remaining} / ${state.bricks.length}`, WIDTH - 34, 30);
            ctx.fillStyle = '#19263d';
            ctx.fillRect(34, 43, WIDTH - 68, 3);
            ctx.fillStyle = config.color;
            ctx.fillRect(34, 43, (WIDTH - 68) * (1 - remaining / state.bricks.length), 3);
            for (const effect of state.effects) {
                const progress = 1 - effect.life / effect.maxLife;
                ctx.globalAlpha = 1 - progress;
                ctx.fillStyle = effect.color;
                ctx.font = 'bold 17px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(effect.text, effect.x, effect.y - progress * 36);
                if (effect.ring) {
                    ctx.strokeStyle = effect.color;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(effect.x, effect.y + BRICK_H / 2, 10 + progress * 92, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.lineWidth = 1;
                }
            }
            ctx.globalAlpha = 1;
        }

        function drawPaddle() {
            const p = state.paddle;
            const g = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
            g.addColorStop(0, '#d0f4ff');
            g.addColorStop(1, '#4ea8de');
            ctx.fillStyle = g;
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            ctx.fillRect(p.x + 8, p.y + 2, p.w - 16, 3);
        }

        function drawBall() {
            const ball = state.ball;
            for (let i = 0; i < ball.trail.length; i += 1) {
                const tr = ball.trail[i];
                ctx.globalAlpha = (1 - i / ball.trail.length) * 0.35;
                ctx.fillStyle = '#9be7ff';
                ctx.beginPath();
                ctx.arc(tr.x, tr.y, ball.r * (1 - i / ball.trail.length * 0.6), 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            const rg = ctx.createRadialGradient(ball.x - 2, ball.y - 3, 1, ball.x, ball.y, ball.r + 2);
            rg.addColorStop(0, '#ffffff');
            rg.addColorStop(0.35, '#a5f3ff');
            rg.addColorStop(1, '#38d9a9');
            ctx.fillStyle = rg;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawParticles() {
            for (const p of state.particles) {
                ctx.globalAlpha = p.life / p.maxLife;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }
            ctx.globalAlpha = 1;
        }

        function drawOverlay() {
            if (state.transition || (state.levelIntro && state.running)) {
                const transition = state.transition;
                const y = transition ? 210 : 345;
                ctx.fillStyle = 'rgba(6, 12, 28, 0.92)';
                ctx.fillRect(110, y - 38, WIDTH - 220, 118);
                ctx.fillStyle = currentLevel().color;
                ctx.fillRect(110, y - 38, 3, 118);
                ctx.textAlign = 'center';
                ctx.font = 'bold 28px Arial';
                ctx.fillText(transition ? `${currentLevel().name} · 已突破` : `第 ${state.level} 关 · ${currentLevel().name}`, WIDTH / 2, y);
                ctx.fillStyle = '#dbe7ff';
                ctx.font = '17px Arial';
                ctx.fillText(transition ? `过关 +${transition.bonus} 分${transition.extraLife ? '   生命 +1' : ''}  ·  下一关：${LEVELS[state.level].name}` : currentLevel().hint, WIDTH / 2, y + 30);
                if (!transition) {
                    ctx.fillStyle = '#8eaccb';
                    ctx.font = '15px Arial';
                    ctx.fillText('点击发球 / 按空格开始', WIDTH / 2, y + 60);
                }
                return;
            }
            if (!state.gameOver && !state.win) return;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.42)';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            ctx.textAlign = 'center';

        }

        function render(t) {
            ctx.save();
            if (state.shake.time > 0) {
                const power = (state.shake.time / 0.25) * state.shake.strength;
                ctx.translate((Math.random() - 0.5) * power, (Math.random() - 0.5) * power);
            }

            drawBackground(t);
            drawBricks(t);
            drawPaddle();
            drawBall();
            drawParticles();
            drawStageInfo();

            if (state.flash.time > 0) {
                ctx.fillStyle = state.flash.color;
                ctx.globalAlpha = Math.min(0.26, state.flash.time * 0.8);
                ctx.fillRect(0, 0, WIDTH, HEIGHT);
                ctx.globalAlpha = 1;
            }

            drawOverlay();
            ctx.restore();
        }

        function gameLoop(ts) {
            frameId = null;
            if (state.paused || state.menu) return;
            const dt = lastTs === null ? 0 : Math.min(0.033, (ts - lastTs) / 1000);
            lastTs = ts;
            animationTime += dt * 1000;
            if (dt > 0) update(dt);
            render(animationTime);
            frameId = requestAnimationFrame(gameLoop);
        }

        function startLoop() {
            if (frameId !== null) return;
            lastTs = null;
            frameId = requestAnimationFrame(gameLoop);
        }

        function stopLoop() {
            if (frameId !== null) cancelAnimationFrame(frameId);
            frameId = null;
            lastTs = null;
        }

        function clearInput() {
            if (activePointerId !== null && canvas.hasPointerCapture(activePointerId)) {
                canvas.releasePointerCapture(activePointerId);
            }
            activePointerId = null;
            keys.left = keys.right = mobileLeft = mobileRight = false;
            state.paddle.dx = 0;
        }

        function showMenu(kind) {
            state.menu = kind;
            resultPanel.hidden = true;
            resetResultShare();
            clearInput();
            stopLoop();
            syncAudio();
            const paused = kind === 'pause';
            menuTitle.textContent = paused ? '暂停中' : 'BREAKOUT';
            menuDescription.textContent = paused
                ? `第 ${state.level} 关 · 得分 ${state.score} · 剩余 ${state.lives} 条生命。准备好后继续。`
                : `挑战 ${LEVELS.length} 个主题关卡：装甲、连锁爆破与移动砖阵。每过三关补充一条生命，向每周高分榜发起挑战。`;
            menuPrimaryBtn.textContent = paused ? '继续游戏' : '开始游戏';
            menuRestartBtn.hidden = menuHomeBtn.hidden = !paused;
            pauseBtn.disabled = launchBtn.disabled = restartBtn.disabled = mainMenuBtn.disabled = !paused;
            if (!menu.open) menu.showModal();
            menuPrimaryBtn.focus();
        }

        function closeMenu() {
            state.menu = null;
            menu.close();
            pauseBtn.disabled = launchBtn.disabled = restartBtn.disabled = mainMenuBtn.disabled = false;
            canvas.focus({ preventScroll: true });
        }

        function togglePause() {
            if (state.gameOver || state.win) {
                returnToMainMenu();
                return;
            }
            if (!state.running) return;
            state.paused = !state.paused;
            if (state.paused) {
                showMenu('pause');
                setStatus('已暂停，按 P 或 Esc 继续');
            } else {
                closeMenu();
                setStatus(state.ball.launched ? '继续游戏' : '按空格发球');
                unlockAudio();
                startLoop();
            }
            pauseBtn.textContent = state.paused ? '继续' : '暂停';
        }

        function restart() {
            submitFinalScore();
            runNumber += 1;
            scoreSubmission = null;
            setLeaderboardStatus('本周最高单局分数 · 每周重置');
            stopLoop();
            clearInput();
            resetLevel(1, false);
            animationTime = 0;
            closeMenu();
            setStatus('按空格发球，左右方向键、鼠标或触屏移动挡板');
            pauseBtn.textContent = '暂停';
            render(animationTime);
            unlockAudio();
            startLoop();
        }

        function returnToMainMenu() {
            submitFinalScore();
            state.running = false;
            state.paused = false;
            showMenu('main');
            setStatus('点击“开始游戏”开启新的一局');
        }

        function onKeyDown(e) {
            const key = e.key.toLowerCase();
            if (state.menu === 'main') return;
            if (key === 'p' || key === 'escape') {
                e.preventDefault();
                if (!e.repeat) togglePause();
                return;
            }
            if (key === 'r') {
                e.preventDefault();
                if (!e.repeat) restart();
                return;
            }
            if (!isPlaying()) return;
            // 保留按钮原生的空格/回车激活行为。
            if (e.target instanceof HTMLButtonElement) return;
            if (key === 'arrowleft' || key === 'a') {
                keys.left = true;
                e.preventDefault();
            }
            if (key === 'arrowright' || key === 'd') {
                keys.right = true;
                e.preventDefault();
            }
            if (key === ' ' || key === 'spacebar') {
                launchBall();
                e.preventDefault();
            }
        }

        function onKeyUp(e) {
            const key = e.key.toLowerCase();
            if (key === 'arrowleft' || key === 'a') keys.left = false;
            if (key === 'arrowright' || key === 'd') keys.right = false;
        }

        function movePaddleToPointer(e) {
            const rect = canvas.getBoundingClientRect();
            if (!rect.width) return;
            const x = ((e.clientX - rect.left) / rect.width) * WIDTH;
            state.paddle.x = clamp(x - state.paddle.w / 2, 0, WIDTH - state.paddle.w);
            if (!state.ball.launched) resetBall();
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (!isPlaying() || e.isPrimary === false || (e.pointerType === 'mouse' && e.button !== 0)) return;
            activePointerId = e.pointerId;
            canvas.setPointerCapture(e.pointerId);
            movePaddleToPointer(e);
            e.preventDefault();
        });
        canvas.addEventListener('pointermove', (e) => {
            if (!isPlaying()) return;
            if (e.pointerType === 'mouse' || e.pointerId === activePointerId) movePaddleToPointer(e);
        });
        function endCanvasPointer(e) {
            if (e.pointerId !== activePointerId) return;
            activePointerId = null;
            if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
        }
        canvas.addEventListener('pointerup', endCanvasPointer);
        canvas.addEventListener('pointercancel', endCanvasPointer);
        canvas.addEventListener('lostpointercapture', endCanvasPointer);

        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);

        shareResultBtn.addEventListener('click', shareResult);
        document.getElementById('result-restart-btn').addEventListener('click', restart);
        document.getElementById('result-home-btn').addEventListener('click', returnToMainMenu);
        launchBtn.addEventListener('click', launchBall);
        pauseBtn.addEventListener('click', togglePause);
        restartBtn.addEventListener('click', restart);
        soundButtons.forEach(button => button.addEventListener('click', () => {
            setSoundEnabled(!audio.enabled);
        }));
        leaderboardButtons.forEach(button => button.addEventListener('click', openWeeklyLeaderboard));
        retryScoreButtons.forEach(button => button.addEventListener('click', () => submitFinalScore(true)));
        menuPrimaryBtn.addEventListener('click', () => {
            if (state.menu === 'pause') togglePause();
            else restart();
        });
        menuRestartBtn.addEventListener('click', restart);
        menuHomeBtn.addEventListener('click', returnToMainMenu);
        mainMenuBtn.addEventListener('click', returnToMainMenu);
        menu.addEventListener('cancel', (e) => {
            e.preventDefault();
            if (state.menu === 'pause') togglePause();
        });
        function pauseOnLeave() {
            clearInput();
            if (isPlaying()) togglePause();
        }
        window.addEventListener('blur', pauseOnLeave);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) pauseOnLeave();
        });

        const leftBtn = document.getElementById('left-btn');
        const rightBtn = document.getElementById('right-btn');
        const launchMobileBtn = document.getElementById('launch-mobile-btn');

        function bindHoldButton(button, setter, value) {
            let heldPointerId = null;
            const onStart = (e) => {
                if (!isPlaying() || heldPointerId !== null) return;
                heldPointerId = e.pointerId;
                button.setPointerCapture(e.pointerId);
                setter(value);
                e.preventDefault();
            };
            const onEnd = (e) => {
                if (e.pointerId !== heldPointerId) return;
                heldPointerId = null;
                setter(false);
                if (button.hasPointerCapture(e.pointerId)) button.releasePointerCapture(e.pointerId);
            };
            button.addEventListener('pointerdown', onStart);
            button.addEventListener('pointerup', onEnd);
            button.addEventListener('pointercancel', onEnd);
            button.addEventListener('lostpointercapture', onEnd);
        }

        bindHoldButton(leftBtn, (v) => { mobileLeft = v; }, true);
        bindHoldButton(rightBtn, (v) => { mobileRight = v; }, true);
        launchMobileBtn.addEventListener('click', launchBall);

        const stageObserver = new ResizeObserver(fitCanvas);
        stageObserver.observe(gameStage);
        window.addEventListener('resize', fitCanvas);
        fitCanvas();
        createBricks(1);
        resetBall();
        updateHud();
        render(animationTime);
        returnToMainMenu();
    </script>
</body>
</html>
